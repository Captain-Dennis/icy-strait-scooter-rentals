# Native iOS → TestFlight (Codemagic).
# No CocoaPods. No secrets in this file.
#
# Before the first green TestFlight upload:
# 1. In Codemagic → Team settings → Integrations → Developer Portal,
#    add an App Store Connect API key. Copy the exact integration name.
# 2. Replace Escooter rental below with that name.
# 3. Upload or generate an Apple Distribution certificate + App Store
#    provisioning profile for com.icystrait.scooterrentals
#    (Team settings → codemagic.yaml settings → Code signing identities).
# 4. Replace 6810469934 with the numeric Apple ID from
#    App Store Connect → App Information (not the bundle ID).

workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      # Placeholder: must match the Codemagic Apple Developer Portal integration name.
      app_store_connect: Escooter rental
    environment:
      ios_signing:
        # Explicit refs (Codemagic Settings → Code signing identities)
        provisioning_profiles:
          - app_store
        certificates:
          - ios-distribution
      vars:
        BUNDLE_ID: com.icystrait.scooterrentals
        XCODE_PROJECT: IcyStraitScooterRentals.xcodeproj
        XCODE_SCHEME: IcyStraitScooterRentals
        # Numeric App Store Connect Apple ID (App Information). Placeholder until assigned.
        APP_STORE_APPLE_ID: 6810469934
      xcode: latest
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Increment build number
        script: |
          #!/bin/sh
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          if [ "$APP_STORE_APPLE_ID" = "6810469934" ]; then
            echo "APP_STORE_APPLE_ID is still a placeholder; bumping from CURRENT_PROJECT_VERSION."
            CURRENT=$(xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -showBuildSettings 2>/dev/null | awk '/CURRENT_PROJECT_VERSION = / { print $3; exit }')
            CURRENT=${CURRENT:-1}
            agvtool new-version -all $((CURRENT + 1))
          else
            LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
            agvtool new-version -all $((LATEST_BUILD_NUMBER + 1))
          fi
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
